version: '3.8'

services:
  thangka-ai:
    build:
      context: .
      dockerfile: Dockerfile.advanced
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./temp:/app/temp
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - PADDLE_CUDNN_DETERMINISTIC=1
      - PADDLE_CUDNN_BENCHMARK=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - thangka-ai
    restart: unless-stopped

volumes:
  redis_data:
